version: "3.8"

services:
  nest-app:
    container_name: diploma-node.js
    build:
      context: .
    ports:
      - "${HTTP_PORT:-3001}:${HTTP_PORT:-3001}"
    environment:
      HTTP_PORT: "${HTTP_PORT:-3001}"
      MONGO_URL: "${MONGO_URL}"
      JWT_SECRET: "${JWT_SECRET}"
    env_file:
      - .env
    restart: unless-stopped